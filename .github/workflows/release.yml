name: Release

# v0.1.2 같은 태그를 밀면 배포된다. 순서가 이 파일의 요점이다:
#   테스트 → PyPI → MCP 레지스트리
# 앞 단계가 실패하면 뒤 단계는 실행되지 않는다. 손으로 명령을 이어 치면
# PyPI가 403으로 실패해도 레지스트리 등록은 성공해서, 레지스트리가 PyPI에 없는
# 버전을 광고하는 상태가 된다 — 0.1.1에서 실제로 겪은 일이다.

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv run --group dev pytest -q

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write        # Trusted Publisher용 — 토큰을 저장할 필요가 없다
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # 버전이 태그·pyproject·server.json 세 군데에 적혀 있다. 하나가 어긋난 채
      # 나가면 레지스트리가 PyPI에 없는 버전을 광고하게 된다 (0.1.1에서 겪은 일).
      - name: 세 곳의 버전이 모두 같은지 확인
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv version --short)
          reg=$(python3 -c "import json;d=json.load(open('server.json'));print(d['version'])")
          regpkg=$(python3 -c "import json;d=json.load(open('server.json'));print(d['packages'][0]['version'])")
          echo "tag=$tag pyproject=$pkg server.json=$reg package=$regpkg"
          for v in "$pkg" "$reg" "$regpkg"; do
            [ "$tag" = "$v" ] || { echo "버전 불일치 — 태그는 $tag"; exit 1; }
          done
      - run: uv build
      - run: uv publish --trusted-publishing always

  registry:
    needs: pypi              # PyPI가 성공해야만 레지스트리를 건드린다
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: PyPI에 그 버전이 실제로 보이는지 확인
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/dotplot-mcp/$v/json" >/dev/null && exit 0
            echo "waiting for dotplot-mcp $v on PyPI ($i/30)"
            sleep 10
          done
          echo "PyPI에서 $v 를 찾을 수 없음 — 레지스트리에 올리지 않는다"; exit 1
      - name: mcp-publisher 설치
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
