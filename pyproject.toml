[project]
name = "dotplot-mcp"
version = "0.1.4"
description = "See individual users, not aggregate charts — YC's Dot Plot methodology as an MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0"]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]        # 평면 모듈 구조라 저장소 루트를 import 경로에 넣는다
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/brownglasses/dotplot-mcp"

[project.scripts]
dotplot-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 서버가 import하는 모듈은 하나도 빠지면 안 된다 — 빠지면 설치판에서만 ImportError로 죽는다
# (generate_report → history, find_similar_cases → cases)
py-modules = ["server", "analysis", "report", "benchmark", "i18n", "history", "cases"]
