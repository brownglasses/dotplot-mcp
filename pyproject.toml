[project]
name = "dotplot-mcp"
version = "0.1.0"
description = "See individual users, not aggregate charts — YC's Dot Plot methodology as an MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/brownglasses/dotplot-mcp"

[project.scripts]
dotplot-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "analysis", "report", "benchmark", "i18n"]
